<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">                                                     <!-- text encoding (emoji need UTF-8) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">  <!-- fit phone screens, incl. the notch -->
<meta name="robots" content="noindex">                                     <!-- unlisted: ask search engines not to list it -->
<title>Virtual Pantry</title>                                              <!-- browser tab title -->
<meta name="theme-color" content="#050505">                                <!-- colours the phone's status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">                   <!-- iPhone: open full-screen from the home screen -->
<meta name="mobile-web-app-capable" content="yes">                         <!-- same, for Android / Chrome (the newer tag name) -->
<meta name="apple-mobile-web-app-title" content="Pantry">                   <!-- name under the home-screen icon -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">        <!-- black status bar with white text -->
<link rel="apple-touch-icon" href="icon-180.png?v=2">                      <!-- the witchy fridge on the iPhone home screen (?v= so phones fetch the new one) -->
<link rel="icon" type="image/png" href="favicon.png?v=2">                  <!-- fridge in the browser tab -->
<link rel="manifest" href="manifest.webmanifest">                          <!-- web-app settings (name, icons, colours) -->
<link rel="preconnect" href="https://fonts.googleapis.com">                <!-- start connecting to Google Fonts early -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">  <!-- old-book font + blackletter font -->
<link rel="stylesheet" href="style.css?v=13">                               <!-- our styles (?v= = version, so browsers fetch the new file) -->
</head>
<body>

<!-- Top bar: logo, search, counts, menu -->
<header class="topbar">
  <div class="brand"><img src="favicon.png" alt=""><span>Pantry</span></div>  <!-- fridge logo + name -->
  <input id="search" type="search" placeholder="Search…" autocomplete="off">  <!-- fades tiles that don't match -->
  <span id="counts" class="counts"></span>                                     <!-- '144 items · 2 low · 15 out' -->
  <button id="signin-pill" class="btn small primary" hidden>Sign in</button>  <!-- shown whenever you're not signed in -->
  <button id="menu-btn" class="icon-btn" aria-label="Menu">⋯</button>          <!-- opens the menu -->
</header>

<!-- Tabs -->
<nav class="tabs">
  <button data-view="shelves" class="active">🧊<span>Shelves</span></button>
  <button data-view="shopping">🛒<span>Shopping</span></button>
  <button data-view="cook">🍳<span>Cook</span></button>
  <button data-view="leftovers">🍱<span>Leftovers</span></button>
  <button data-view="projects">⚗️<span>Projects</span></button>
</nav>

<main>
  <section id="view-shelves" class="view active">                <!-- the illustrated shelves -->
    <div id="unit-chips" class="chips"></div>                    <!-- All / Pantry / Fridge / ... filter -->
    <div id="scene" class="scene"></div>                         <!-- units drawn here -->
    <div class="snow"></div>                                     <!-- snowy floor -->
  </section>
  <section id="view-shopping" class="view panel"></section>      <!-- shopping list -->
  <section id="view-cook" class="view panel"></section>          <!-- what can I cook? -->
  <section id="view-leftovers" class="view panel"></section>     <!-- leftovers -->
  <section id="view-projects" class="view panel"></section>      <!-- ongoing projects -->
</main>

<button id="fab" class="fab" aria-label="Add to pantry">+</button>  <!-- big round + : add something -->

<!-- Item editor (opens over everything) -->
<dialog id="sheet" class="sheet"><form id="item-form" method="dialog"></form></dialog>

<!-- Photo scan: hidden picker (phones offer Camera or Photo Library) + the "check what Gemini found" sheet -->
<input id="scan-file" type="file" accept="image/*" hidden>                 <!-- image/* = any photo; iPhone sends .heic as JPEG -->
<dialog id="scan-sheet" class="sheet"><form id="scan-form" method="dialog"></form></dialog>

<!-- Project editor -->
<dialog id="project-sheet" class="sheet small"><form id="project-form" method="dialog"></form></dialog>

<!-- Menu -->
<dialog id="menu" class="sheet small">
  <div id="menu-body"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden>  <!-- hidden file picker for Import -->
</dialog>

<!-- Sign-in -->
<dialog id="login" class="sheet small">
  <form id="login-form" method="dialog">
    <h2>🧊 Virtual Pantry</h2>
    <p class="muted">Sign in to sync between your phone and laptop.</p>
    <div class="row"><button class="btn google" type="button" id="google-btn"><b>G</b> Sign in with Google</button></div>  <!-- Google account sign-in -->
    <p class="muted center">or with email</p>
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error"></p>
    <div class="row"><button class="btn primary" value="signin">Sign in</button></div>
    <p class="muted center">or</p>
    <div class="row"><button class="btn" type="button" id="local-btn">Use on this device only</button></div>
  </form>
</dialog>

<div id="toast" class="toast"></div>   <!-- small pop-up messages -->

<script type="module" src="app.js?v=13"></script>  <!-- the app (type=module lets files import each other); ?v=13 = version, so browsers fetch new code -->
<!-- When you change any .js file: bump the ?v= number here AND on the imports at the top of app.js. -->
</body>
</html>
